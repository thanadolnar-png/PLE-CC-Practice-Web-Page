name: Remote Compile and Push

on:
  workflow_dispatch:
    inputs:
      filter_mode:
        description: 'เลือกโหมดการ Compile'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'cases'
          - 'keyword'
          - 'category'
          - 'source'
      filter_query:
        description: 'คำค้นหา/รหัสเคส/หมวด (เช่น OSPE-CL83M101 หรือ Dosage form หรือ Product)'
        required: false
        default: ''
        type: string
      commit_msg:
        description: 'ข้อความกำกับ Git Commit'
        required: false
        default: 'Remote Compile & Update Offline DB'
        type: string

jobs:
  compile_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-auth google-auth-oauthlib google-api-python-client gspread cryptography pillow

      - name: Run Compile Script
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY || secrets.COMPILE_AND_PUSH }}
        run: |
          python scripts/compile_offline_db_python.py --mode "${{ github.event.inputs.filter_mode }}" --query "${{ github.event.inputs.filter_query }}" --web-dir "."

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add case-data-offline.js case-details-offline.js app.js *.html
          if git diff --staged --quiet; then
            echo "No changes detected to commit."
          else
            git commit -m "${{ github.event.inputs.commit_msg }} [mode: ${{ github.event.inputs.filter_mode }}, query: '${{ github.event.inputs.filter_query }}']"
            git push origin main
          fi
